name: 메자닌 수집

on:
  schedule:
    - cron: "37 22 * * *"   # 매일 07:37 (한국시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OUR_KEYWORDS: ${{ secrets.OUR_KEYWORDS }}
      - name: 결과 저장
        run: |
          git config user.name "mezz-bot"
          git config user.email "mezz-bot@users.noreply.github.com"
          git add data/deals.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
